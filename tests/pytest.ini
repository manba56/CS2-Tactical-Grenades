[pytest]
minversion = 7.0
testpaths = unit api e2e

# Allure
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --maxfail=5

# Markers
markers =
    smoke: Fast critical-path tests (< 30 s)
    regression: Full regression suite
    api: Backend API tests
    e2e: End-to-end browser tests (Playwright)
    security: Security / rate-limit / anomaly tests
    slow: Tests that take > 10 s
    unit: Pure function unit tests (no server needed)

# Timeout
timeout = 60

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
