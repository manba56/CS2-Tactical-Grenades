<VirtualHost *:80>
    ServerName _
    DocumentRoot /www/wwwroot/cs2-tactics/cs2-web/dist

    LimitRequestBody 52428800

    <Directory /www/wwwroot/cs2-tactics/cs2-web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(?!admin/|api/|static/)(.*)$ /index.html [L]
    </Directory>

    Alias /admin /www/wwwroot/cs2-tactics/cs2-admin/dist
    <Directory /www/wwwroot/cs2-tactics/cs2-admin/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /admin/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ /admin/index.html [L]
    </Directory>

    ProxyPass /api http://127.0.0.1:8008/api
    ProxyPassReverse /api http://127.0.0.1:8008/api

    ProxyPass /static http://127.0.0.1:8008/static
    ProxyPassReverse /static http://127.0.0.1:8008/static
</VirtualHost>
