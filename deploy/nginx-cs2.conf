# CS2 Tactics Suite - Nginx Configuration
# Copy to: /www/server/panel/vhost/nginx/yourdomain.com.conf
# Or add to your Nginx site config in Baota panel

server {
    listen 80;
    server_name yourdomain.com;  # <-- CHANGE THIS to your domain or server IP

    # Upload size limit (for screenshot uploads)
    client_max_body_size 50m;

    # ── cs2-web (player frontend) ──────────────────────
    location / {
        root /www/wwwroot/cs2-tactics/cs2-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── cs2-admin (management panel) ──────────────────
    location /admin {
        alias /www/wwwroot/cs2-tactics/cs2-admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── API proxy (FastAPI) ───────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static files (uploads, map assets) ────────────
    location /static/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }
}
