# CS2 Tactics Suite - Nginx Configuration
# Copy to: /www/server/panel/vhost/nginx/yourdomain.com.conf
# Replace yourdomain.com with your real domain.

server {
    listen 80;
    server_name yourdomain.com;

    client_max_body_size 50m;

    # Player frontend
    location / {
        root /www/wwwroot/cs2-tactics/cs2-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin frontend
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /www/wwwroot/cs2-tactics/cs2-admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files and static map assets
    location /static/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }
}
